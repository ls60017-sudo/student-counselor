<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#382972">
  <title>الموجّه الطلابي — دون اتصال</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(145deg,#382972,#208caa);font-family:Tahoma,Arial,sans-serif;color:#fff}.card{width:min(460px,100%);padding:32px;border-radius:28px;background:#ffffff18;border:1px solid #ffffff35;text-align:center;box-shadow:0 24px 60px #10194755}.icon{width:76px;height:76px;margin:auto;display:grid;place-items:center;border-radius:24px;background:#fff;color:#382972;font-size:38px;font-weight:900}.card h1{font-size:24px;margin:22px 0 10px}.card p{line-height:1.9;color:#eef8ff;margin:0}.card button{margin-top:22px;border:0;border-radius:14px;padding:12px 22px;background:#fff;color:#382972;font:700 15px Tahoma,Arial;cursor:pointer}
  </style>
</head>
<body><main class="card"><div class="icon">✓</div><h1>التطبيق محفوظ على جهازك</h1><p>تعذّر الاتصال الآن. افتح التطبيق مجددًا أو اضغط إعادة المحاولة، وستبقى بياناتك المحفوظة على الجهاز.</p><button onclick="location.reload()">إعادة المحاولة</button></main></body>
</html>
